# ARGUS isolated lab. Own network + names so it never touches other containers.
name: argus-lab
networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24
services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: argus-dvwa
    networks:
      labnet:
        ipv4_address: 10.77.0.10
  juice:
    image: bkimminich/juice-shop
    container_name: argus-juice
    networks:
      labnet:
        ipv4_address: 10.77.0.11
  tools:
    build: ./tools
    container_name: argus-tools
    command: sleep infinity
    networks:
      labnet:
        ipv4_address: 10.77.0.2
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: argus-zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    networks:
      labnet:
        ipv4_address: 10.77.0.3
    ports:
      - "127.0.0.1:18090:8090"
