<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS - AI VAPT Agent</title>
<link rel="icon" href="/img/hero.svg">
<link rel="stylesheet" href="/style.css?v=3">
<script>
(function(){
  try{
    var qs = new URLSearchParams(location.search).get("theme");
    var saved = qs || localStorage.getItem("argus-theme");
    document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
  }catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
})();
</script>
</head>
<body>
<header>
  <div class="brand" id="home" title="Back to start"><img src="/img/hero.svg" alt="" class="logo"><div><b>ARGUS</b><small>AI security-testing agent &middot; lab only &middot; human-approved</small></div></div>
  <div class="badges" id="badges"></div>
  <button class="themeToggle sm" id="btnTheme" title="Switch between dark and light mode"><span class="dot" id="themeDot">&#9789;</span><span id="themeLabel">Dark</span></button>
  <button class="ghost sm" id="btnHelp">? How it works</button>
</header>
<div class="layout">
  <aside>
    <h3>1 &middot; What should ARGUS test?</h3>
    <textarea id="req" rows="4" aria-label="Describe the test in plain English"></textarea>
    <div class="presets" id="presets"></div>
    <div class="row"><button class="primary" id="btnPlan">Check scope &amp; make a plan</button></div>
    <div class="hint">Nothing is scanned yet. ARGUS first checks every target against the allowed scope and shows you a plan to approve.</div>
    <div class="row"><button class="ghost" id="btnOos" title="No traffic is sent to the public address.">Safety demo: ask for an out-of-scope target</button></div>
    <details><summary>Allowed scope (the safety fence)</summary><div id="scopeBox" class="scopebox"></div></details>
    <h3>Past assessments</h3>
    <div id="hist" class="histList"></div>
    <div class="asideFoot">ARGUS &middot; Binary Builders</div>
  </aside>
  <main>
    <section id="welcome"></section>
    <section id="workspace" class="hidden">
      <div id="status" class="statusbar"></div>
      <div id="stepper" class="stepper"></div>
      <div id="next" class="next"></div>
      <nav id="tabs">
        <button data-t="overview" class="on">Overview</button>
        <button data-t="plan">Plan &amp; reasoning</button>
        <button data-t="timeline">Live activity</button>
        <button data-t="findings">Findings</button>
        <button data-t="graph">Attack paths</button>
        <button data-t="approvals">Approvals <span id="apCount" class="pill hidden">0</span></button>
        <button data-t="copilot">Ask ARGUS</button>
        <button data-t="report">Report &amp; audit</button>
        <button data-t="matrix">Tools</button>
      </nav>
      <section id="t-overview" class="tab"></section>
      <section id="t-plan" class="tab hidden"></section>
      <section id="t-timeline" class="tab hidden"></section>
      <section id="t-findings" class="tab hidden"></section>
      <section id="t-graph" class="tab hidden"></section>
      <section id="t-approvals" class="tab hidden"></section>
      <section id="t-copilot" class="tab hidden"></section>
      <section id="t-report" class="tab hidden"></section>
      <section id="t-matrix" class="tab hidden"></section>
    </section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="mbox"><div class="mhead"><b id="mtitle"></b><button class="ghost sm" id="mclose">Close</button></div><div id="mhtml" class="mhtml hidden"></div><pre id="mbody"></pre></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js?v=3"></script>
</body>
</html>
